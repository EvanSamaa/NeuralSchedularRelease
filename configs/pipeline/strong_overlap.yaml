# Text scene -> TTS -> schedule in which every speaker change overlaps the
# previous turn (heated, interrupting exchange). No backchannels.
#
# Scheduler parameters of the research tree's forced-overlap run
# (run_pipeline_extreme_overlap.sh); the scene and voices of that run are not
# distributed, so this config points at a neutral example.
# On a speaker change the incoming turn must start while 20-40 % of its own
# length still overlaps the previous turn.
#
#   python -m neural_scheduler.pipeline.run --config configs/pipeline/strong_overlap.yaml

mode: three_pass
steps: [1, 2, 3]
variants: [bc_never]

io:
  input_jsonl: examples/scenes/plain_turntaking.jsonl
  out_dir: outputs/plain_turntaking/strong_overlap

classifier:
  type: text
  word_selection: random
  dir: /path/to/bc_classifier/best_model          # REQUIRED (or type: none with probability: 0, no variants)
  tokenizer_dir: /path/to/bc_classifier/tokenizer
  confidence_threshold: 1.0
  context_window_turns: 10
  context_window_future_turns: 5
  vocab_per_class: examples/bc_vocab/everyday.json
  vocab: [yeah]
  probability: 1.0

tts:
  backend: chatterbox
  ref_s1: /path/to/reference_voice_1.wav          # REQUIRED: your own reference recordings
  ref_s2: /path/to/reference_voice_2.wav
  seed: 42
  device: cuda
  cfg_weight: 0.5
  exaggeration: 0.5
  bc_silence_padding_ms: 5000
  inter_turn_silence_ms: 2000
  intra_turn_pause_ms: 1000

tokenizer:
  audio_tokenizer_path: THUDM/glm-4-voice-tokenizer
  model_id: THUDM/glm-4-voice-9b
  device: cuda

vad:
  threshold: 0.1
  min_speech_ms: 50
  min_silence_ms: 50

scheduler:
  checkpoint: /path/to/scheduler/checkpoint       # REQUIRED: scheduler checkpoint directory
  device: cuda
  output_sr: 22050
  save_video: true
  save_input_scripts: true
  pass1:
    search_window: 10
    search_stride: 1
    scoring_context: 5
    inter_turn_gap: 6
    schedule_subturns: false
    speaker_1_subturn_min_pause: -5
    speaker_1_subturn_max_pause: 5
    speaker_2_subturn_min_pause: -5
    speaker_2_subturn_max_pause: 5
    subturn_search_stride: 1
    use_speaker_gap_constraints: true
    speaker_1_min_gap: -10
    speaker_1_max_gap: 5
    speaker_2_min_gap: -10
    speaker_2_max_gap: 5
    use_strong_overlap_constraints: true
    strong_overlap_min: 0.2
    strong_overlap_max: 0.4
  pass2:
    search_stride: 1
    scoring_context: 0
    bc_position_limit: 0.7
  pass3:
    scoring_context: 10

# Optional: how to start each step. Step 1 usually needs its own Python
# environment (Chatterbox pins different package versions than the rest).
# environment:
#   step1:
#     python: /path/to/tts-env/bin/python        # interpreter for this step
#     env_setup: "source /path/to/activate_tts_env.sh"   # or a shell snippet run first
#     env: {NEURAL_SCHEDULER_STUB_TORCHVISION_META: "1"} # only if torchvision breaks the import
#   step2: {env: {GLM4VOICE_REPO: /path/to/GLM-4-Voice}}

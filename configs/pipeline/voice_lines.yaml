# Recorded voice lines -> turn-taking schedule, no backchannels.
#
# Mirrors experiments/inference_pipeline_10_examples/napster/run_pipeline.sh
# (parameters only; supply your own recordings). That run loaded the text-only
# classifier and disabled it with the "bc_never" variant; here no classifier is
# loaded at all (classifier.type: none schedules voice lines without
# backchannels). To add backchannels, set type to joint or text, give dir,
# tokenizer_dir and vocab_per_class, and use variants: [classifier].
#
#   python -m neural_scheduler.pipeline.run --config configs/pipeline/voice_lines.yaml

mode: three_pass
steps: [1, 2, 3]

io:
  input_dialogue_json: examples/voice_lines/dialogue_template.json   # REQUIRED: point at your dialogue
  out_dir: outputs/voice_lines/no_bc

classifier:
  type: none
  suppress_consecutive_bcs: false
  vocab: [yeah]

tts:                              # only used to synthesise backchannels
  backend: chatterbox
  ref_s1: /path/to/reference_voice_1.wav          # REQUIRED: your own reference recordings
  ref_s2: /path/to/reference_voice_2.wav
  seed: 42
  device: cuda
  cfg_weight: 0.5
  exaggeration: 0.01
  bc_silence_padding_ms: 5000
  voice_line_padding_ms: 5000
  inter_turn_silence_ms: 2000

tokenizer:
  audio_tokenizer_path: THUDM/glm-4-voice-tokenizer
  model_id: THUDM/glm-4-voice-9b
  device: cuda

vad:
  threshold: 0.1
  min_speech_ms: 50
  min_silence_ms: 50

scheduler:
  checkpoint: /path/to/scheduler/checkpoint       # REQUIRED: scheduler checkpoint directory
  device: cuda
  output_sr: 22050
  save_video: true
  save_input_scripts: true
  pass1:
    search_window: 10
    search_stride: 1
    scoring_context: 5
    inter_turn_gap: 6
    schedule_subturns: false
    speaker_1_subturn_min_pause: -5
    speaker_1_subturn_max_pause: 5
    speaker_2_subturn_min_pause: -5
    speaker_2_subturn_max_pause: 5
    subturn_search_stride: 1
    use_speaker_gap_constraints: false
    speaker_1_min_gap: -10
    speaker_1_max_gap: 5
    speaker_2_min_gap: -10
    speaker_2_max_gap: 5
  pass2:
    search_stride: 1
    scoring_context: 0
    bc_position_limit: 0.7
  pass3:
    scoring_context: 10

# Optional: how to start each step. Step 1 usually needs its own Python
# environment (Chatterbox pins different package versions than the rest).
# environment:
#   step1:
#     python: /path/to/tts-env/bin/python        # interpreter for this step
#     env_setup: "source /path/to/activate_tts_env.sh"   # or a shell snippet run first
#     env: {NEURAL_SCHEDULER_STUB_TORCHVISION_META: "1"} # only if torchvision breaks the import
#   step2: {env: {GLM4VOICE_REPO: /path/to/GLM-4-Voice}}
